<!doctype html>
<!-- Set inline rather than only in CSS: the browser builds its own UI (scrollbars,
     form control chrome) from this, and a stylesheet can arrive too late to count. -->
<html lang="en" dir="ltr" class="dark" style="color-scheme: dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Mahamat Adam | Software Engineer</title>
    <meta
      name="description"
      content="Portfolio of Mahamat Youssouf Taher Adam, a software engineer focused on frontend, interactive 3D web experiences and solution engineering."
    />

    <link rel="canonical" href="https://mahamat-adam.github.io/" />

    <!-- Social link previews. The absolute URLs below must match the live site. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Mahamat Adam" />
    <meta property="og:url" content="https://mahamat-adam.github.io/" />
    <meta property="og:title" content="Mahamat Adam | Software Engineer" />
    <meta
      property="og:description"
      content="Frontend engineer building production React apps, reusable design systems and scroll-driven 3D product experiences."
    />
    <meta property="og:image" content="https://mahamat-adam.github.io/og.jpg" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Mahamat Adam, Software Engineer" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Mahamat Adam | Software Engineer" />
    <meta
      name="twitter:description"
      content="Frontend engineer building production React apps, reusable design systems and scroll-driven 3D product experiences."
    />
    <meta name="twitter:image" content="https://mahamat-adam.github.io/og.jpg" />
    <!-- Structured data so a search engine ties the name to the right person and
         to his own profiles, rather than guessing. Deliberately no email address:
         this page is public and the address has been harvested from it before. -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "Person",
        "@id": "https://mahamat-adam.github.io/#mahamat",
        "name": "Mahamat Youssouf Taher Adam",
        "alternateName": "Mahamat Adam",
        "url": "https://mahamat-adam.github.io/",
        "image": "https://mahamat-adam.github.io/og.jpg",
        "jobTitle": "Software Engineer",
        "description": "Software engineer focused on frontend, interactive 3D web experiences and solution engineering.",
        "sameAs": [
          "https://www.linkedin.com/in/mahamat-adam-6803b5265/",
          "https://github.com/Mahamat-Adam"
        ],
        "address": {
          "@type": "PostalAddress",
          "addressLocality": "Kuala Lumpur",
          "addressCountry": "MY"
        },
        "alumniOf": {
          "@type": "CollegeOrUniversity",
          "name": "Universiti Tun Hussein Onn Malaysia",
          "sameAs": "https://uthm.edu.my/"
        },
        "knowsLanguage": [
          { "@type": "Language", "name": "Arabic" },
          { "@type": "Language", "name": "English" }
        ],
        "knowsAbout": [
          "React",
          "TypeScript",
          "JavaScript",
          "Tailwind CSS",
          "Three.js",
          "Framer Motion",
          "PHP",
          "Laravel",
          "Python",
          "Node.js",
          "Flutter",
          "MySQL",
          "REST APIs"
        ],
        "seeks": {
          "@type": "Demand",
          "name": "Software engineering, frontend and solution engineering roles",
          "availableAtOrFrom": [
            { "@type": "Country", "name": "Saudi Arabia" },
            { "@type": "Country", "name": "United Arab Emirates" },
            { "@type": "Place", "name": "Europe" },
            { "@type": "Country", "name": "United States" }
          ]
        }
      }
    </script>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%23E63946'/%3E%3Ctext x='32' y='44' font-family='Arial,sans-serif' font-size='34' font-weight='bold' fill='white' text-anchor='middle'%3EMA%3C/text%3E%3C/svg%3E"
    />
    <script>
      ;(function () {
        try {
          var t = localStorage.getItem('theme')
          var light = t === 'light'
          document.documentElement.classList.toggle('dark', !light)
          document.documentElement.style.colorScheme = light ? 'light' : 'dark'

          // Resolved here, not in React: applying dir after first paint would
          // render the whole page one way and then mirror it.
          var stored = localStorage.getItem('lang')
          var l = ['ar', 'fr', 'es'].indexOf(stored) >= 0 ? stored : 'en'
          document.documentElement.lang = l
          document.documentElement.dir = l === 'ar' ? 'rtl' : 'ltr'
        } catch (e) {
          document.documentElement.classList.add('dark')
          document.documentElement.style.colorScheme = 'dark'
        }
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
